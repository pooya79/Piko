version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/platform/database/dbgen
        sql_package: pgx/v5
        emit_interface: false
        emit_empty_slices: true
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type:
              import: time
              type: Time
