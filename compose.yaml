name: buildx

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: buildx
      POSTGRES_PASSWORD: buildx
      POSTGRES_DB: buildx
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildx -d buildx"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    # Redis 8.10.2 is upstream, but no official image exists for it yet.
    image: redis:8.10.1-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes: ["./db/migrations:/migrations"]
    entrypoint: ["migrate", "-path=/migrations", "-database=postgres://buildx:buildx@postgres:5432/buildx?sslmode=disable"]
    depends_on:
      postgres: {condition: service_healthy}
  river-migrate:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://buildx:buildx@postgres:5432/buildx?sslmode=disable
      LOG_LEVEL: info
    entrypoint: ["/app/buildx-river-migrate"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
